baseURL = "https://promatw.github.io/ai-intel/"
languageCode = "zh-tw"
title = "AI / CoWoS 情報"
timeZone = "Asia/Taipei"
paginate = 10
defaultContentLanguage = "zh-tw"
enableRobotsTXT = true

[params]
  env = "production"
  description = "AI infrastructure, CoWoS, advanced packaging and semiconductor supply-chain intelligence in Traditional Chinese."
  author = "promatw"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

[params.homeInfoParams]
  Title = "AI / CoWoS 情報"
  Content = "追蹤 AI 算力基礎設施、CoWoS 先進封裝、半導體供應鏈與模型實驗室動態。"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/promatw/ai-intel"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "分類"
    url = "/categories/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "標籤"
    url = "/tags/"
    weight = 30

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"
